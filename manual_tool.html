<!doctype html>
<meta charset="utf-8">
<title>Book Scan Station</title>
<link rel="stylesheet" href="/manual_tool.css">
<header>
  <div class="file-picker"><select id="files"></select></div>
  <button id="prev">Previous</button>
  <button id="next">Next</button>
  <button id="rotateLeft" title="Rotate 90 degrees counterclockwise">Rotate Left</button>
  <button id="rotateRight" title="Rotate 90 degrees clockwise">Rotate Right</button>
  <button id="minusDegree" title="Rotate half a degree counterclockwise">-0.5&deg;</button>
  <input id="angle" type="number" step="0.1" value="0" title="Rotation angle in degrees">
  <button id="plusDegree" title="Rotate half a degree clockwise">+0.5&deg;</button>
  <button id="zoomOut" title="Zoom image out">Zoom -</button>
  <span id="zoomLabel">100%</span>
  <button id="zoomIn" title="Zoom image in">Zoom +</button>
  <button id="save">Save Crop</button>
  <span id="status"></span>
</header>
<main>
  <section id="work">
    <div id="stage">
      <img id="image">
      <svg id="overlay" preserveAspectRatio="none"></svg>
    </div>
  </section>
  <aside>
    <div class="view-tabs" role="tablist" aria-label="Sidebar view">
      <button id="workTab" type="button" role="tab" aria-selected="true" aria-controls="workView" class="active">Work</button>
      <button id="settingsTab" type="button" role="tab" aria-selected="false" aria-controls="settingsView">Settings</button>
    </div>
    <div id="workView" role="tabpanel" aria-labelledby="workTab">
      <section class="cms-panel" aria-labelledby="cmsHeading">
      <div class="section-heading">
        <h2 id="cmsHeading">CMS Upload</h2>
        <span id="cmsConnection" class="connection-state">Disconnected</span>
      </div>
      <div class="cms-connect-row">
        <input id="cmsUrl" type="url" value="https://api.josefchladek.com" aria-label="CMS API URL">
        <button id="cmsConnect">Connect</button>
      </div>
      <a id="cmsApprovalLink" class="approval-link" target="_blank" rel="noopener" hidden>Open approval page</a>
      <div id="cmsConnected" hidden>
        <label class="field-label" for="cmsSearch">Book</label>
        <input id="cmsSearch" type="search" placeholder="Title, author, publisher, or ID" autocomplete="off">
        <div id="cmsResults" class="book-results"></div>
        <div id="cmsSelected" class="selected-book" hidden></div>
        <div class="upload-controls">
          <label class="position-field" for="cmsPosition">
            <span class="field-label">Image position</span>
            <input id="cmsPosition" type="number" min="1" max="2147483647" step="1" value="1" inputmode="numeric">
          </label>
          <label id="cmsOverwriteControl" class="overwrite-control" hidden>
            <input id="cmsOverwrite" type="checkbox">
            <span>Unlock replacement</span>
          </label>
        </div>
        <button id="cmsUpload" class="upload-button" disabled>Upload Current Crop</button>
      </div>
      <p id="cmsUploadStatus" class="cms-status" aria-live="polite"></p>
      </section>

      <h2>Scans</h2>
      <div id="thumbs" class="thumb-grid"></div>
      <h2>Corner Magnifier</h2>
      <canvas id="loupe" class="loupe" width="240" height="240"></canvas>
      <div class="loupe-controls">
        <label><input id="loupeToggle" type="checkbox" checked> Show</label>
        <select id="loupeZoom">
          <option value="2" selected>2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
        </select>
      </div>
      <label class="hint"><input id="correction" type="checkbox" checked> ColorChecker correction</label>
      <label class="hint"><input id="trimDarkEdges" type="checkbox" checked> Trim dark scanner edges</label>
      <p class="hint">Drag the four blue corners to the physical book boundary. Hold Option (Alt) and drag along an edge to straighten it.</p>
      <p id="info" class="hint"></p>
      <div class="row"><button id="reset">Reset Rectangle</button></div>
    </div>
    <section id="settingsView" role="tabpanel" aria-labelledby="settingsTab" hidden>
      <h2>Directories</h2>
      <label class="field-label" for="sourceDirectory">Source scans directory</label>
      <input id="sourceDirectory" class="directory-input" type="text" autocomplete="off" spellcheck="false">
      <label class="field-label" for="finalStoreDirectory">Final-store directory</label>
      <input id="finalStoreDirectory" class="directory-input" type="text" autocomplete="off" spellcheck="false">
      <button id="saveSettings" class="settings-save" type="button">Save Settings</button>
      <p id="settingsStatus" class="cms-status" aria-live="polite"></p>
    </section>
  </aside>
</main>
<script src="/manual_tool.js"></script>
