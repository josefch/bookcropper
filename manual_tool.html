<!doctype html>
<meta charset="utf-8">
<title>Book Scan Station</title>
<link rel="stylesheet" href="/manual_tool.css">
<header><div class="file-picker"><select id="files"></select></div><button id="prev">Previous</button><button id="next">Next</button><button id="rotateLeft" title="Rotate 90 degrees counterclockwise">Rotate Left</button><button id="rotateRight" title="Rotate 90 degrees clockwise">Rotate Right</button><button id="minusDegree" title="Rotate half a degree counterclockwise">-0.5°</button><input id="angle" type="number" step="0.1" value="0" title="Rotation angle in degrees"><button id="plusDegree" title="Rotate half a degree clockwise">+0.5°</button><button id="zoomOut" title="Zoom image out">Zoom -</button><span id="zoomLabel">100%</span><button id="zoomIn" title="Zoom image in">Zoom +</button><button id="save">Save Crop</button><span id="status"></span></header>
<main><section id="work"><div id="stage"><img id="image"><svg id="overlay" preserveAspectRatio="none"></svg></div></section><aside><h2>Scans</h2><div id="thumbs" class="thumb-grid"></div><h2>Corner Magnifier</h2><canvas id="loupe" class="loupe" width="240" height="240"></canvas><div class="loupe-controls"><label><input id="loupeToggle" type="checkbox" checked> Show</label><select id="loupeZoom"><option value="2" selected>2x</option><option value="4">4x</option><option value="8">8x</option></select></div><label class="hint"><input id="correction" type="checkbox" checked> ColorChecker correction</label><p class="hint">Drag the four blue corners to the physical book boundary. Hold Option (Alt) and drag along an edge to straighten it.</p><p id="info" class="hint"></p><div class="row"><button id="reset">Reset Rectangle</button></div></aside></main>
<script src="/manual_tool.js"></script>
